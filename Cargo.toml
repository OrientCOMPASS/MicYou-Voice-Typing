[package]
name = "micyou-voice-typing"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# 宿主 SDK FFI 我们手动定义以保证编译独立性
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Media_Audio",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemServices",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_System_Threading"
]}
crossbeam-channel = "0.5"
chrono = "0.4"
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = true