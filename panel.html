<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  body { font-family: sans-serif; padding: 20px; color: hsl(var(--on-surface)); background: hsl(var(--surface)); }
  .field { margin-bottom: 15px; }
  label { display: block; margin-bottom: 5px; font-weight: bold; }
  select, input { width: 100%; padding: 8px; border-radius: 4px; border: 1px solid hsl(var(--outline)); background: hsl(var(--surface-container)); color: hsl(var(--on-surface)); box-sizing: border-box; }
  button { padding: 10px 15px; background: hsl(var(--primary)); color: hsl(var(--on-primary)); border: none; border-radius: 4px; cursor: pointer; margin-top: 10px; }
  button:hover { opacity: 0.9; }
  .hint { font-size: 12px; color: hsl(var(--on-surface-variant)); margin-top: 5px; }
</style>
</head>
<body>
  <h2>Voice-Typing 设置</h2>
  <div class="field">
    <label for="mode">触发模式</label>
    <select id="mode">
      <option value="toggle">按键切换 (Toggle)</option>
      <option value="push_to_talk">长按说话 (Push-to-Talk)</option>
    </select>
  </div>
  <div class="field">
    <label for="hotkey">触发快捷键</label>
    <input type="text" id="hotkey" readonly placeholder="点击下方按钮录制快捷键">
    <button id="recordBtn">录制快捷键</button>
    <div class="hint">支持组合键，如 Ctrl+Shift+A。录制时请按下 desired 组合键。</div>
  </div>
  <button id="saveBtn">保存设置</button>

  <script>
    function call(api, args) {
      return new Promise((resolve, reject) => {
        const id = Math.random().toString(36).slice(2);
        const onMsg = (e) => {
          if (e.data && e.data.__micyou === 1 && e.data.id === id) {
            window.removeEventListener('message', onMsg);
            e.data.ok ? resolve(e.data.value) : reject(new Error(e.data.error));
          }
        };
        window.addEventListener('message', onMsg);
        window.parent.postMessage({ __micyou: 1, id, api, args: args || {} }, '*');
      });
    }

    const modeSelect = document.getElementById('mode');
    const hotkeyInput = document.getElementById('hotkey');
    const recordBtn = document.getElementById('recordBtn');
    const saveBtn = document.getElementById('saveBtn');

    let isRecording = false;

    async function loadConfig() {
      try {
        const cfg = await call('get_config', {});
        if (cfg) {
          modeSelect.value = cfg.mode || 'toggle';
          hotkeyInput.value = cfg.hotkey || 'lctrl+lshift';
        }
      } catch (e) { console.error(e); }
    }

    recordBtn.addEventListener('click', () => {
      isRecording = true;
      recordBtn.textContent = '请按下快捷键...';
      hotkeyInput.value = '';
    });

    document.addEventListener('keydown', (e) => {
      if (!isRecording) return;
      e.preventDefault();
      
      let parts = [];
      if (e.ctrlKey) parts.push('ctrl');
      if (e.shiftKey) parts.push('shift');
      if (e.altKey) parts.push('alt');
      
      const key = e.key.toLowerCase();
      if (!['control', 'shift', 'alt', 'meta'].includes(key)) {
        parts.push(key);
      }
      
      if (parts.length > 0 && !['control', 'shift', 'alt', 'meta'].includes(key)) {
        hotkeyInput.value = parts.join('+');
        isRecording = false;
        recordBtn.textContent = '录制快捷键';
      }
    });

    saveBtn.addEventListener('click', async () => {
      const config = {
        mode: modeSelect.value,
        hotkey: hotkeyInput.value
      };
      try {
        await call('set_config', { key: 'mode', value: config.mode });
        await call('set_config', { key: 'hotkey', value: config.hotkey });
        alert('保存成功！');
      } catch (e) {
        alert('保存失败: ' + e.message);
      }
    });

    loadConfig();
  </script>
</body>
</html>
